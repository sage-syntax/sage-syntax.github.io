<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Warm Sunset-Orange Backdrop -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Inner 3D Radiant Golden Sun Sphere -->
    <linearGradient id="circle-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="48%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- 3D Spherical Specular Highlight & Rim Depth -->
    <radialGradient id="sphere-light" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#fde047" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.30" />
    </radialGradient>

    <!-- Diagonal Glass Sheen -->
    <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Warm Depth Shadow -->
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#7c2d12" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- Full-Bleed Outer Canvas -->
  <rect width="100" height="100" fill="url(#bg-grad)" />

    <!-- 3D Radiant Golden Sun Sphere -->
    <circle cx="50" cy="50" r="44" fill="url(#circle-grad)" filter="url(#soft-shadow)" />
    <circle cx="50" cy="50" r="44" fill="url(#sphere-light)" />

    <!-- Crisp Pure White Rising Sun & Horizon Waves Emblem -->
    <g filter="url(#soft-shadow)">
      <g stroke="#ffffff" stroke-width="3.6" stroke-linecap="round">
        <line x1="50" y1="21" x2="50" y2="26.5" />
        <line x1="31.5" y1="27.5" x2="35.5" y2="31.5" />
        <line x1="68.5" y1="27.5" x2="64.5" y2="31.5" />
        <line x1="22.5" y1="45" x2="28" y2="45" />
        <line x1="77.5" y1="45" x2="72" y2="45" />
      </g>
      <path d="M 33,52 A 17,17 0 0,1 67,52 Z" fill="#ffffff" />
      <path d="M 24,59.5 Q 37,54.5 50,59.5 T 76,59.5" fill="none" stroke="#ffffff" stroke-width="4.8" stroke-linecap="round" />
      <path d="M 29,69 Q 39.5,65 50,69 T 71,69" fill="none" stroke="#fef9c3" stroke-width="3.8" stroke-linecap="round" />
    </g>
    <!-- Vector DEV Pill Badge (Zero Font Dependency) -->
    <rect x="48" y="73" width="46" height="21" rx="5" fill="#1c1917" stroke="#fde047" stroke-width="1.8"/>
    <path d="M 55.62 88 L 55.62 78.91 L 58.85 78.91 Q 60.26 78.91 61.26 79.46 Q 62.27 80.00 62.80 81.02 Q 63.33 82.04 63.33 83.44 Q 63.33 84.85 62.79 85.87 Q 62.26 86.90 61.24 87.45 Q 60.22 88 58.79 88 Z M 57.59 86.35 L 58.71 86.35 Q 59.69 86.35 60.32 86.01 Q 60.95 85.66 61.23 85.00 Q 61.51 84.35 61.51 83.44 Q 61.51 82.53 61.23 81.88 Q 60.95 81.23 60.33 80.89 Q 59.71 80.55 58.76 80.55 L 57.59 80.55 Z M 66.22 88 L 66.22 78.91 L 72.34 78.91 L 72.34 80.49 L 68.19 80.49 L 68.19 82.66 L 72.03 82.66 L 72.03 84.24 L 68.19 84.24 L 68.19 86.42 L 72.36 86.42 L 72.36 88 Z M 76.43 78.91 L 78.57 85.79 L 78.65 85.79 L 80.80 78.91 L 82.97 78.91 L 79.83 88 L 77.40 88 L 74.25 78.91 Z" fill="#fde047"/>

  <!-- Diagonal Glass Sheen Overlay -->
  <path d="M 0,0 L 0,100 L 30,100 L 70,0 Z" fill="url(#sheen-grad)" />
</svg>
