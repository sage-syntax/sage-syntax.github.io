<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SunScout — Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=/sunscout/app/">
  <link rel="canonical" href="https://sage-syntax.github.io/sunscout/app/">
  <script>
    (function () {
      var target = '/sunscout/app/' + (window.location.search || '') + (window.location.hash || '');
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            if (r.scope && /\/sunscout\/$/.test(r.scope)) {
              r.unregister();
            }
          });
          window.location.replace(target);
        }).catch(function () {
          window.location.replace(target);
        });
      } else {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body style="background:#090f1d;color:#94a3b8;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
  <p>Redirecting to <a href="/sunscout/app/" style="color:#f59e0b">SunScout</a>...</p>
</body>
</html>
